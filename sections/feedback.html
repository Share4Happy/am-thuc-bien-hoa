    <section class="feedback-section" id="feedback">
        <div class="container">
            <h2 class="feedback-title">GỬI ĐÁNH GIÁ CHO CHÚNG TÔI</h2>

            <div class="feedback-card">
                <div class="feedback-rating-row">
                    <span class="feedback-rating-question">Bạn đánh giá tổng thể trang web thế nào?</span>
                    <div class="feedback-interactive-stars" id="star-rating">
                        <i class="ri-star-line" data-val="1"></i>
                        <i class="ri-star-line" data-val="2"></i>
                        <i class="ri-star-line" data-val="3"></i>
                        <i class="ri-star-line" data-val="4"></i>
                        <i class="ri-star-line" data-val="5"></i>
                    </div>
                </div>

                <p class="feedback-instruction">Vui lòng dành chút thời gian cho chúng tôi ý kiến của bạn</p>

                <form class="feedback-input-box" id="feedback-form" novalidate autocomplete="off">
                    <!-- Anti-spam Honeypot (hidden from human visitors) -->
                    <input type="text" name="website_hp" id="feedback-hp" style="display:none !important;" tabindex="-1" autocomplete="off" aria-hidden="true">
                    <input type="text" class="feedback-input-line" id="feedback-text" placeholder="Nhập ý kiến hoặc câu hỏi của bạn tại đây..." maxlength="500" minlength="4" required>
                    <button type="submit" class="feedback-send-btn" aria-label="Gửi đánh giá">
                        <i class="ri-send-plane-2-fill"></i>
                    </button>
                </form>
            </div>

            <div class="feedback-subtext">
                <p class="feedback-subtext-title">Bạn có thắc mắc hay cần tư vấn ?</p>
                <p class="feedback-subtext-desc">Hãy để lại thông tin, đội ngũ của chúng tôi sẽ liên hệ sớm nhất.</p>
            </div>
        </div>
    </section>
