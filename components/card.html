<!-- Component: Explore Category Card -->
<article class="explore-card">
    <div class="explore-card-img-wrapper">
        <img src="asset/images/categories/cha_lui.jpg" alt="Danh mục món ngon" class="explore-card-img" loading="lazy" decoding="async">
    </div>
    <div class="explore-card-body">
        <h3 class="explore-card-title">
            <i class="ri-restaurant-line"></i> Ẩm thực đường phố
        </h3>
        <p class="explore-card-desc">
            Khám phá những món ăn mang hương vị riêng của Biên Hòa.
        </p>
        <a href="#streetfood" class="btn-pill-dark">
            XEM MÓN NGON <i class="ri-arrow-right-line"></i>
        </a>
    </div>
</article>

<!-- Component: Street Food Item Small Card -->
<div class="dish-small-card">
    <div class="dish-small-img-box">
        <img src="asset/images/streetfood/cha_lui.jpg" alt="Chả lụi" loading="lazy" decoding="async">
    </div>
    <div class="dish-small-body">
        <h4 class="dish-small-name">Chả lụi</h4>
        <div class="dish-small-actions">
            <span>Chi tiết</span>
            <i class="ri-arrow-right-line"></i>
        </div>
    </div>
</div>

<!-- Component: Local Restaurant Card -->
<article class="restaurant-card">
    <div class="restaurant-img-box">
        <img src="asset/images/restaurants/lau_tom_5ri.jpg" alt="Lẩu tôm 5 Ri" loading="lazy" decoding="async">
    </div>
    <div class="restaurant-card-body">
        <h4 class="restaurant-card-title">LẨU TÔM 5 RI</h4>
        <div class="restaurant-info-item">
            <i class="ri-map-pin-line"></i>
            <span>20/3C Khóm 5, Phường Hòa Bình</span>
        </div>
        <div class="restaurant-info-item">
            <i class="ri-time-line"></i>
            <span>09:00 - 22:00</span>
        </div>
        <div class="restaurant-card-footer">
            <span class="restaurant-price">Khoảng 80.000đ - 250.000đ</span>
            <a href="#restaurants" class="circle-arrow-btn" aria-label="Xem chi tiết">
                <i class="ri-arrow-right-line"></i>
            </a>
        </div>
    </div>
</article>

<!-- Component: Customer Review Card -->
<div class="review-card">
    <div class="review-card-top">
        <div class="review-avatar-box">
            <i class="ri-user-fill"></i>
        </div>
        <div class="review-user-info">
            <h4 class="review-user-name">Tài khoản người dùng</h4>
            <div class="review-rating-stars">
                <i class="ri-star-fill"></i>
                <i class="ri-star-fill"></i>
                <i class="ri-star-fill"></i>
                <i class="ri-star-fill"></i>
                <i class="ri-star-fill"></i>
            </div>
        </div>
    </div>
    <p class="review-card-text">
        "Mình thích nhất là phần gợi ý món ngon và địa chỉ rất rõ ràng."
    </p>
    <div class="review-card-time">4 ngày trước</div>
</div>
